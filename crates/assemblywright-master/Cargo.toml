[package]
name = "assemblywright-master"
version = "0.1.4"
description = "Portable durable state kernel for Assemblywright distributed development."
default-run = "assemblywright-master"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "assemblywright-master"
path = "src/main.rs"

[[bin]]
name = "assemblywright-developer"
path = "src/developer_main.rs"

[[bin]]
name = "assemblywright-review-provider"
path = "src/review_provider_adapter.rs"

[[bin]]
name = "assemblywright-brainstorming-provider"
path = "src/brainstorming_provider_adapter.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
getrandom.workspace = true
git2.workspace = true
hyper.workspace = true
hyper-util.workspace = true
assemblywright-protocol = { path = "../assemblywright-protocol", version = "0.1.4" }
libc.workspace = true
p256.workspace = true
reqwest.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }
windows-service.workspace = true
